[package]
name = "postflop-solver"
version = "0.1.0"
authors = ["Wataru Inariba"]
edition = "2021"
description = "An open-source postflop solver for Texas hold'em poker"
documentation = "https://b-inary.github.io/postflop_solver/postflop_solver/"
repository = "https://github.com/b-inary/postflop-solver"


[dependencies]
bincode = { version = "2.0.0-rc.3", optional = true }
wit-bindgen-rt = { version = "0.42.1", features = ["bitflags"] }
chrono = "0.4.41"
once_cell = "1.18.0"
rayon = { version = "1.10.0", optional = true }
regex = "1.9.6"
# clang = "2.0.0"
# zstd = { version = "0.13.0", optional = true, default-features = false }
anyhow = "1.0.98"

[features]
# default = ["bincode" , "rayon"]
default = ["bincode"]
custom-alloc = []
# bincode = ["dep:bincode"]
# rayon = ["dep:rayon", "zstd?/zstdmt"]

[lib]
crate-type = ["cdylib", "rlib"] # cdylib: 「このクレートは共有ライブラリとして出力すべきだ」という明示。Rustのデフォルトでは lib クレートは Rust専用（rlib）形式でビルドされ、.wasm は生成されない。
# path = "src/wasm_lib.rs"

[package.metadata.component]
package = "holdem-solver:host"

[package.metadata.component.target]
path = "wit/host.wit"
