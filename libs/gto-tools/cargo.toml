[package]
name = "gto-tools"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
range = { path = "../range" }
tree = { path = "../tree" }
solver = { path = "../solver" }
wit-bindgen-rt = { version = "0.42.1", features = ["bitflags"] }

[package.metadata.component.target]
path = "../../wit/holdem-solver/gto-tools.wit"

[package.metadata.component]
package = "holdem-solver:gto-tools"
